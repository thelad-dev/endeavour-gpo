[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endeavour-gpo"
version = "0.1.0"
description = "Samba GPO CSEs for AD drive maps and printers on EndeavourOS (mount.cifs, CUPS, ILT)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "thelad-dev" }]
keywords = ["samba", "gpo", "active-directory", "endeavouros", "cifs", "drive-maps", "cups", "printers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
endeavour-gpo-register = "endeavour_gpo.cli:register_cse"
endeavour-gpupdate = "endeavour_gpo.gpupdate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["endeavour_gpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
